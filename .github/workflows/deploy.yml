name: Main CI
   
on:
  push:
    branches:
      - dev
   
jobs:
  build-and-deploy:
    runs-on: ubuntu-18.04
    steps:
      - name: git clone
        uses: actions/checkout@v2
   
      - name: pnpm install
        run: pnpm install
   
      - name: pnpm build
        run: pnpm run build
   
      - name: deploy
        env:
          AWS_ACCESS_KEY_ID: '$'
          AWS_SECRET_ACCESS_KEY: '$'
        run:
          aws s3 cp --recursive --region ap-northeast-2 dist s3://home.manual
   
